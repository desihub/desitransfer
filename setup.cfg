[pycodestyle]
# See https://pycodestyle.readthedocs.io/en/latest/intro.html#configuration
# for details of these configuration options.
#
# These are normally ignored by default:
# ignore = E121, E123, E126, E133, E226, E241, E242, E704, W503, W504
#
# These are the explicitly ignored styles:
# - W504: line break after binary operator
# - E501: not ignored, but 190 will eventually be reduced.
max-line-length = 190
ignore = W504

[flake8]
# See https://flake8.pycqa.org/en/latest/user/configuration.html
# for details of these configuration options. They are similar to pycodestyle.
#
# These are issues that are currently seen:
# - E501: line too long (deliberately set line length shorter than above)
# - F841: local variable ... is assigned to but never used
# - W504: line break after binary operator
max-line-length = 185
max-doc-length = 115
# Deliberately ignore nothing so that all statistics can be printed in tests.
ignore =
